# =====================================================================
# ShopFlow 全栈一键部署编排
#
#   docker compose up -d --build
#
# 服务拓扑：
#   浏览器 -> web(Nginx:80) --/api--> api(Spring Boot:8080) --> mysql(8.0) / redis(7)
#
# 设计要点：
#   1. 依赖顺序用 healthcheck + service_healthy 控制，避免应用比数据库先起来导致启动失败；
#   2. 所有敏感配置从 .env 注入，默认值只用于本地演示，生产必须覆盖；
#   3. MySQL 首次初始化自动执行 schema.sql 与 data.sql，做到"开箱即用"；
#   4. 数据落 volume，容器重建不丢数据。
# =====================================================================
name: shopflow

services:

  # ---------------- MySQL ----------------
  mysql:
    image: mysql:8.0
    container_name: shopflow-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-shopflow_root_pwd}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-shopflow}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
      - --max-connections=500
      - --innodb-buffer-pool-size=256M
    ports:
      - "${MYSQL_HOST_PORT:-13306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次启动时按文件名顺序执行，自动建表并写入演示数据
      - ./shopflow-backend/src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./shopflow-backend/src/main/resources/db/data.sql:/docker-entrypoint-initdb.d/02-data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - shopflow-net

  # ---------------- Redis ----------------
  redis:
    image: redis:7-alpine
    container_name: shopflow-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"                 # AOF 持久化：库存缓存的最终一致性依赖定时对账，丢失后也能重建，但保留更稳妥
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    ports:
      - "${REDIS_HOST_PORT:-16379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - shopflow-net

  # ---------------- 后端 ----------------
  api:
    build:
      context: ./shopflow-backend
      dockerfile: Dockerfile
    image: shopflow/api:1.0.0
    container_name: shopflow-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TZ: Asia/Shanghai
      LOG_PATH: /app/logs
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-shopflow}
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-shopflow_root_pwd}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SHOPFLOW_JWT_SECRET: ${SHOPFLOW_JWT_SECRET:-shopflow-compose-secret-change-me-in-production-0123456789}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080,http://localhost}
    ports:
      - "${API_HOST_PORT:-18080}:8080"
    volumes:
      - api-logs:/app/logs
    networks:
      - shopflow-net

  # ---------------- 前端 ----------------
  web:
    build:
      context: ./shopflow-web
      dockerfile: Dockerfile
    image: shopflow/web:1.0.0
    container_name: shopflow-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
    ports:
      - "${WEB_HOST_PORT:-8080}:80"
    networks:
      - shopflow-net

volumes:
  mysql-data:
  redis-data:
  api-logs:

networks:
  shopflow-net:
    driver: bridge