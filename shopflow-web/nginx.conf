# =====================================================================
# 前端 Nginx 配置
#   1. 托管 Vue 构建产物，并支持 history 模式路由（找不到文件回退 index.html）
#   2. 把 /api 反向代理到后端容器，前端与后端对浏览器呈现为同源，天然没有跨域问题
#   3. 静态资源长缓存 + index.html 不缓存，兼顾加载速度与发版即时生效
# =====================================================================

server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    charset utf-8;

    # 访问日志带上上游耗时，便于定位慢请求
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_vary on;

    # ---------- 后端接口反向代理 ----------
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # 下单等写操作超时给足，读接口也共用该配置
        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    # 健康检查透传（便于用同一入口探活后端）
    location /actuator/health {
        proxy_pass http://api:8080/actuator/health;
        proxy_set_header Host $host;
    }

    # ---------- 静态资源：带 hash 的文件长缓存 ----------
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html 不缓存，保证发版后用户立刻拿到新的资源引用
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # ---------- history 模式路由回退 ----------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 隐藏 Nginx 版本号
    server_tokens off;
}